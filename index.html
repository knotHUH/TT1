<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentines Day</title>
    <link rel="icon" href="pic/fav.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="background">
            <video autoplay loop muted playsinline>
            <source src="pic/heart.webm" type="video/webm"></video>
        </div>
        <div class="container">
            <div class="image-box">
                <div class="actual-image">
                    <img src="pic/rigby.gif" alt="gif" class="gif" id="gif">
                    </div>
                    <div class="text-one">
                        <p id="text">Will You Be My Valentines?❤️😘</p>
                    </div>
            </div>
            <div class="yes-no">
                <button class="yes" id="yes">Yes</button>
                <button class="no" id="no">No</button>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
    
</body>
</html>
